# mTLS server for e2e tests: the client certificate is required, verified
# against the test CA, and its identity (email SAN) is the authentication.
# tests/configs/certs/client-cert.pem carries client@nats.zig.test and is
# mapped below; client2-cert.pem carries other@nats.zig.test and is not.
listen: 127.0.0.1:14232
http: 127.0.0.1:18232
server_name: nats-tls-mtls

tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  ca_file: "/etc/nats/certs/ca.pem"
  verify_and_map: true
}

authorization {
  users [
    { user: "client@nats.zig.test" }
  ]
}
