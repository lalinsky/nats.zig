# TLS handshake-first server for e2e tests: the TLS handshake happens
# before the server INFO, like behind a TLS-terminating proxy.
listen: 127.0.0.1:14231
http: 127.0.0.1:18231
server_name: nats-tls-first

tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  handshake_first: true
}
