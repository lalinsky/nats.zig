# TLS-enabled server for e2e tests. The certificate is signed by the
# test CA in tests/configs/certs/ca.pem, with SAN localhost/127.0.0.1.
listen: 127.0.0.1:14230
http: 127.0.0.1:18230
server_name: nats-tls

tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file: "/etc/nats/certs/server-key.pem"
}
